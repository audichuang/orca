name: Fork Release

# Fork-only: a pushed release tag builds the signed arm64 dmg, publishes the GitHub Release and bumps the Homebrew cask.
# fork-release-dryrun-* tags build and sign only (artifact upload, no release, no tap change).
on:
  push:
    tags:
      - 'v*-fork.*'
      - 'fork-release-dryrun-*'

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: fork release dmg
    # Why a variable: it can name a self-hosted runner label; unset, releases build hosted.
    # fork-release-dryrun-hosted-* always runs hosted so the fallback stays tested.
    runs-on: ${{ startsWith(github.ref_name, 'fork-release-dryrun-hosted-') && 'macos-15' || vars.FORK_RELEASE_RUNNER || 'macos-15' }}
    timeout-minutes: 90
    env:
      TAG: ${{ github.ref_name }}
      DRY_RUN: ${{ startsWith(github.ref_name, 'fork-release-dryrun-') }}
      # Why: the packaging PTY check times out under the runner's default login shell setup.
      SHELL: /bin/zsh
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve version and check the tag sits on main
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            version="0.0.0-fork.0"
          else
            version="${TAG#v}"
            # Why: FORK.md moves main and pushes the tag atomically; a tag off main is a mistake, not a release.
            main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            test "$main_sha" = "$GITHUB_SHA" || {
              echo "::error::$TAG ($GITHUB_SHA) is not fork main ($main_sha)."
              exit 1
            }
            # Why: Fork CI gates develop, not main; a main moved to a commit develop never had shipped untested.
            # A rebase rewrites develop, so a commit an earlier published release shipped also passes: a rerun, or
            # a rollback re-tagging the last good release. Drafts are not published (releases/tags omits them).
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/develop...$GITHUB_SHA" --jq .status)
            case "$status" in
              identical|behind) ;;
              *)
                shipped=""
                for t in $(git ls-remote --tags origin 'refs/tags/v*-fork.*' |
                  awk -v sha="$GITHUB_SHA" '$1 == sha { sub("refs/tags/", "", $2); sub(/\^\{\}$/, "", $2); print $2 }' | sort -u); do
                  if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$t" > /dev/null 2>&1; then shipped=$t; break; fi
                done
                [ -n "$shipped" ] || {
                  echo "::error::$TAG ($GITHUB_SHA) is not on fork develop (compare: $status) and no published fork release shipped it."
                  exit 1
                }
                echo "::notice::$GITHUB_SHA is not on develop; published release $shipped already shipped it."
                ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Why first: a missing secret otherwise fails after the build, and HOMEBREW_TAP_TOKEN only after the release is public.
      - name: Check the release secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          names="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER"
          [ "$DRY_RUN" = true ] || names="$names HOMEBREW_TAP_TOKEN"
          missing=""
          for name in $names; do [ -n "$(printenv "$name")" ] || missing="$missing $name"; done
          [ -z "$missing" ] || { echo "::error::Secrets not set:$missing"; exit 1; }

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
          # Why no saves: a cache saved under one release tag is unreadable from the next tag, so each
          # upload (2.5 min hosted, 6.5 min self-hosted) was never restored.
          cache-pnpm-store: 'false'
          persist-native-cache: 'false'

      # Why: build:desktop bundles the mobile web app, which resolves from mobile/node_modules.
      - uses: ./.github/actions/install-mobile-dependencies

      # Why hosted only: a self-hosted runner signs from its own login keychain (FORK.md).
      - name: Import the Developer ID signing identity
        if: runner.environment == 'github-hosted'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/fork-signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d ' "')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm -f "$RUNNER_TEMP/signing.p12"
          security find-identity -v -p codesigning "$keychain"
          # Why: notarization rejects an expired cert, and its replacement needs Apple's portal plus new secrets.
          pem="$RUNNER_TEMP/signing.pem"
          if security find-certificate -c "Developer ID Application:" -p "$keychain" > "$pem" 2> /dev/null; then
            openssl x509 -in "$pem" -noout -checkend $((60 * 86400)) > /dev/null ||
              echo "::warning::The Developer ID cert expires within 60 days ($(openssl x509 -in "$pem" -noout -enddate)); renew it and update APPLE_CERTIFICATE."
          fi
          rm -f "$pem"

      # Why a file: electron-builder's notarize reads APPLE_API_KEY as a path to the .p8.
      - name: Stage the notarization API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      # Why a Developer ID: its team-anchored identity keeps keychain and TCC grants across updates.
      - name: make fork-dmg
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          VERSION: ${{ steps.version.outputs.version }}
        run: make fork-dmg FORK_VERSION="$VERSION"

      # Why: a lost secret must fail the release, not ship an app that re-prompts for every grant.
      - name: Verify the Developer ID signature and notarization
        run: |
          app=dist/mac-arm64/Orca.app
          info=$(codesign --display --verbose=2 "$app" 2>&1)
          printf '%s\n' "$info"
          printf '%s\n' "$info" | grep -q '^Authority=Developer ID Application: ' || { echo "::error::Not signed with a Developer ID Application cert."; exit 1; }
          printf '%s\n' "$info" | grep -q '^TeamIdentifier=37HFR5V2JJ$' || { echo "::error::TeamIdentifier is not 37HFR5V2JJ."; exit 1; }
          # Why offline: make fork-dmg already checked the ticket against Apple; a second CloudKit round trip only adds a network failure.
          printf '%s\n' "$info" | grep -q '^Notarization Ticket=stapled$' || { echo "::error::No stapled notarization ticket."; exit 1; }
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Check the packaged version
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          actual=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' dist/mac-arm64/Orca.app/Contents/Info.plist)
          test "$actual" = "$VERSION" || {
            echo "::error::Packaged version $actual != $VERSION."
            exit 1
          }
          echo "sha256=$(shasum -a 256 dist/orca-fork-macos-arm64.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Why its own step: dry runs exercise it too, and a shallow checkout leaves the tag lightweight.
      - name: Write the release notes
        env:
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          git fetch --depth=1 --force origin "refs/tags/$TAG:refs/tags/$TAG"
          # Why: the release notes are written in the annotated tag's message; a lightweight tag gets a stub.
          notes=$(git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed '/-----BEGIN PGP SIGNATURE-----/,$d')
          [ -n "$notes" ] || notes="Orca Fork ${TAG#v}"
          printf "%s\n\nSHA-256:\`%s\`\n" "$notes" "$SHA256" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Upload dry-run dmg
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: orca-fork-dryrun-dmg
          path: dist/orca-fork-macos-arm64.dmg
          retention-days: 3

      - name: Publish the GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/orca-fork-macos-arm64.dmg --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
          else
            gh release create "$TAG" --verify-tag --latest --title "Orca Fork ${TAG#v}" \
              --notes-file "$RUNNER_TEMP/notes.md" dist/orca-fork-macos-arm64.dmg
          fi

      - name: Bump the Homebrew cask
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          path=repos/audichuang/homebrew-tap/contents/Casks/orca-fork.rb
          gh api "$path" > "$RUNNER_TEMP/cask.json"
          python3 - "$RUNNER_TEMP/cask.json" "$RUNNER_TEMP/cask-put.json" <<'PY'
          import base64, json, os, re, sys
          current = json.load(open(sys.argv[1]))
          text = base64.b64decode(current["content"]).decode()
          text, n_version = re.subn(r'^(\s*version )"[^"]*"', rf'\g<1>"{os.environ["VERSION"]}"', text, count=1, flags=re.M)
          text, n_sha = re.subn(r'^(\s*sha256 )"[0-9a-f]*"', rf'\g<1>"{os.environ["SHA256"]}"', text, count=1, flags=re.M)
          if n_version != 1 or n_sha != 1:
              sys.exit("cask has no single version/sha256 line to bump")
          json.dump({"message": f"orca-fork {os.environ['VERSION']}",
                     "content": base64.b64encode(text.encode()).decode(),
                     "sha": current["sha"]}, open(sys.argv[2], "w"))
          PY
          gh api -X PUT "$path" --input "$RUNNER_TEMP/cask-put.json" --jq '.commit.html_url'

      - name: Remove the signing keychain and API key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          if [ "${{ runner.environment }}" = github-hosted ]; then
            security delete-keychain "$RUNNER_TEMP/fork-signing.keychain-db" 2>/dev/null || true
          fi
