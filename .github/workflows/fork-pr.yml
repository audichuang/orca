# Fork-only PR gate. This fork ships only the macOS arm64 desktop build, so it replaces
# upstream's pr.yml (disabled on the fork by `make fork-ci-disable-upstream`, not edited,
# so rebases never conflict here). Merge gate: the "Fork PR checks passed" job.
name: Fork PR Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

concurrency:
  group: fork-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UPSTREAM_REPO: https://github.com/stablyai/orca.git

jobs:
  # `make fork-check` split in two so its halves run in parallel; together they cover exactly the same checks.
  fork_check_static:
    name: fork-check typecheck and quality
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # Why: FORK_BASE is the newest upstream vX.Y.Z tag, and the fork repo has only -fork tags.
      - name: Fetch upstream release tags
        run: git fetch --no-tags --filter=blob:none "$UPSTREAM_REPO" 'refs/tags/v*:refs/tags/v*'

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node

      # Why: verify:localization-catalogs runs under bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version

      - name: make fork-check-static
        run: make fork-check-static

  fork_check_tests:
    name: fork-check tests (${{ matrix.shard }})
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # Why: FORK_BASE is the newest upstream vX.Y.Z tag, and the fork repo has only -fork tags.
      - name: Fetch upstream release tags
        run: git fetch --no-tags --filter=blob:none "$UPSTREAM_REPO" 'refs/tags/v*:refs/tags/v*'

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node

      - name: make fork-check-tests
        run: make fork-check-tests FORK_TEST_SHARD=${{ matrix.shard }}

  cross_version_wire:
    # Why kept: the fork desktop client talks to hosts running upstream releases.
    name: fork cross-version wire compatibility
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch upstream release tags
        run: git fetch --no-tags --filter=blob:none "$UPSTREAM_REPO" 'refs/tags/v*:refs/tags/v*'

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node

      - name: Daemon protocol crossing against newest release
        run: pnpm run check:daemon-protocol-crossing

      - name: Old/new client and server compatibility journeys
        # Why skip one file: at the fork base this upstream test reads isStructuredTab from a module that no longer exports it.
        # Explicit paths, because a directory filter overrides --exclude; find keeps new files in.
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          $(find tests/e2e/cross-version-wire -name '*.test.ts' ! -name 'cross-version-registered-agents.unit.test.ts' | sort)

  mac_arm64_build:
    # Same steps as `make build`, the build installed on the fork's only target machine.
    name: fork macOS arm64 build
    if: github.event.pull_request.draft != true
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron

      # Why: build:desktop bundles the mobile web app, which resolves from mobile/node_modules.
      - uses: ./.github/actions/install-mobile-dependencies

      - name: make build
        run: make build

  verify:
    name: Fork PR checks passed
    needs: [fork_check_static, fork_check_tests, cross_version_wire, mac_arm64_build]
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every fork check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null || {
            echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
            echo "::error::A fork PR check did not succeed."
            exit 1
          }
